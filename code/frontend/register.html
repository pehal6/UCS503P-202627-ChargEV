<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | chargEV</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- FontAwesome Icons CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Inter Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0b131e;
            color: #f1f5f9;
            overflow-x: hidden;
        }

        .glass-card {
            background: rgba(18, 28, 43, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
        }

        .btn-brand-primary {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: #ffffff;
            font-weight: 600;
            border: none;
            transition: all 0.3s ease;
        }

        .btn-brand-primary:hover {
            background: linear-gradient(135deg, #34d399 0%, #10b981 100%);
            box-shadow: 0 0 20px rgba(16, 185, 129, 0.5);
            color: #ffffff;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between">

    <!-- SYNCHRONIZED NAVBAR -->
    <nav class="sticky top-0 z-50 bg-[#0b131e]/90 backdrop-blur-md border-b border-slate-800">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-20">
                <a href="/index.html" class="flex items-center gap-2 text-decoration-none">
                    <span class="w-10 h-10 rounded-xl bg-emerald-500/10 border border-emerald-500/30 flex items-center justify-center text-emerald-400 text-xl shadow-lg shadow-emerald-500/10">
                        <i class="fa-solid fa-bolt-lightning"></i>
                    </span>
                    <span class="text-2xl font-extrabold tracking-tight text-white">charg<span class="text-emerald-400">EV</span></span>
                </a>

                <div class="hidden md:flex items-center gap-6">
                    <a href="/index.html" class="text-slate-300 hover:text-emerald-400 font-medium transition text-decoration-none">Home</a>
                    <a href="/station.html" class="text-slate-300 hover:text-emerald-400 font-medium transition text-decoration-none">Stations</a>
                    <a href="/booking.html" class="text-slate-300 hover:text-emerald-400 font-medium transition text-decoration-none">Book Slot</a>
                    <a href="/mybooking.html" class="text-slate-300 hover:text-emerald-400 font-medium transition text-decoration-none">My Bookings</a>
                    <a href="/dashboard.html" class="text-slate-300 hover:text-emerald-400 font-medium transition text-decoration-none">Dashboard</a>
                    <a href="/about.html" class="text-slate-300 hover:text-emerald-400 font-medium transition text-decoration-none">About</a>
                    <a href="/contact.html" class="text-slate-300 hover:text-emerald-400 font-medium transition text-decoration-none">Contact</a>
                </div>

                <div class="flex items-center gap-3">
                    <a href="/login.html" class="px-4 py-2 rounded-xl text-slate-300 border border-slate-700 hover:border-slate-500 hover:text-white font-medium text-sm transition text-decoration-none">Login</a>
                    <a href="/register.html" class="btn-brand-primary px-4 py-2 rounded-xl text-sm text-decoration-none">Register</a>
                </div>
            </div>
        </div>
    </nav>

    <!-- REGISTER SECTION -->
    <section class="py-16 flex-grow flex items-center">
        <div class="max-w-md w-full mx-auto px-4 sm:px-6">
            <div class="glass-card p-8 border border-slate-800 space-y-6 shadow-2xl">
                
                <div class="text-center space-y-2">
                    <div class="w-12 h-12 rounded-2xl bg-emerald-500/10 text-emerald-400 flex items-center justify-center text-xl mx-auto border border-emerald-500/30 mb-2">
                        <i class="fa-solid fa-user-plus"></i>
                    </div>
                    <h1 class="text-2xl font-extrabold text-white">Create Account</h1>
                    <p class="text-slate-400 text-xs">Join the Patiala EV charging grid and network.</p>
                </div>

                <div id="alertBox" class="alert d-none py-2 text-xs rounded-xl" role="alert"></div>

                <form id="registerForm" class="space-y-4">
                    <div>
                        <label for="name" class="text-xs text-slate-400 mb-1.5 block font-medium">FULL NAME</label>
                        <div class="relative">
                            <i class="fa-regular fa-user absolute left-4 top-1/2 -translate-y-1/2 text-slate-500"></i>
                            <input type="text" id="name" required class="w-full bg-slate-900 text-slate-200 border border-slate-700/80 rounded-xl pl-11 pr-4 py-3 text-sm focus:outline-none focus:border-emerald-500 transition" placeholder="Rohini">
                        </div>
                    </div>

                    <div>
                        <label for="email" class="text-xs text-slate-400 mb-1.5 block font-medium">EMAIL ADDRESS</label>
                        <div class="relative">
                            <i class="fa-regular fa-envelope absolute left-4 top-1/2 -translate-y-1/2 text-slate-500"></i>
                            <input type="email" id="email" required class="w-full bg-slate-900 text-slate-200 border border-slate-700/80 rounded-xl pl-11 pr-4 py-3 text-sm focus:outline-none focus:border-emerald-500 transition" placeholder="rohini@example.com">
                        </div>
                    </div>

                    <div>
                        <label for="password" class="text-xs text-slate-400 mb-1.5 block font-medium">PASSWORD</label>
                        <div class="relative">
                            <i class="fa-regular fa-lock absolute left-4 top-1/2 -translate-y-1/2 text-slate-500"></i>
                            <input type="password" id="password" required class="w-full bg-slate-900 text-slate-200 border border-slate-700/80 rounded-xl pl-11 pr-4 py-3 text-sm focus:outline-none focus:border-emerald-500 transition" placeholder="Create a secure password">
                        </div>
                    </div>

                    <button type="submit" class="btn-brand-primary w-full py-3 rounded-xl text-sm font-semibold shadow-lg shadow-emerald-500/20">
                        Create Account
                    </button>
                </form>

                <div class="text-center pt-2 border-t border-slate-800">
                    <p class="text-xs text-slate-400">Already have an account? <a href="/login.html" class="text-emerald-400 font-semibold hover:underline text-decoration-none">Sign In</a></p>
                </div>

            </div>
        </div>
    </section>

    <!-- FOOTER -->
    <footer class="bg-[#080d15] border-t border-slate-800/80 py-8 text-center text-xs text-slate-500">
        &copy; 2026 chargEV. All rights reserved. Patiala EV Infrastructure Network.
    </footer>

    <!-- SCRIPT FOR REGISTRATION API -->
    <script>
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const alertBox = document.getElementById('alertBox');

            try {
                const response = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, email, password })
                });

                const data = await response.json();

                if (response.ok && data.success !== false) {
                    alertBox.className = 'alert bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 py-2 text-xs rounded-xl mb-3';
                    alertBox.textContent = 'Registration successful! Redirecting to login...';
                    alertBox.classList.remove('d-none');
                    setTimeout(() => {
                        window.location.href = '/login.html';
                    }, 1500);
                } else {
                    alertBox.className = 'alert bg-red-500/10 border border-red-500/30 text-red-400 py-2 text-xs rounded-xl mb-3';
                    alertBox.textContent = data.message || 'Registration failed';
                    alertBox.classList.remove('d-none');
                }
            } catch (err) {
                console.error("Register Error:", err);
                alertBox.className = 'alert bg-red-500/10 border border-red-500/30 text-red-400 py-2 text-xs rounded-xl mb-3';
                alertBox.textContent = 'Server error. Please try again later.';
                alertBox.classList.remove('d-none');
            }
        });
    </script>
</body>
</html>
