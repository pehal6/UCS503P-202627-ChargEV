<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | chargEV</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light d-flex flex-column min-vh-100 justify-content-between">

    <!-- Simple Header -->
    <nav class="navbar navbar-dark bg-dark py-3">
        <div class="container justify-content-center">
            <a class="navbar-brand fs-3 fw-bold m-0" href="index.html">Charg<span class="text-success">ENG</span></a>
        </div>
    </nav>

    <!-- Login Container -->
    <div class="container my-auto">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="card border-0 shadow-lg rounded-4 p-4 p-md-5">
                    <div class="text-center mb-4">
                        <div class="icon-box bg-success bg-opacity-10 text-success rounded-circle d-inline-flex p-3 mb-2">
                            <i class="bi bi-shield-lock-fill fs-2"></i>
                        </div>
                        <h3 class="fw-bold">Welcome Back</h3>
                        <p class="text-muted small">Log in to manage your EV bookings and account</p>
                    </div>

                    <form id="login-form">
                        <div class="mb-3">
                            <label class="form-label fw-semibold"><i class="bi bi-envelope text-success me-2"></i>Email Address</label>
                            <input type="email" id="login-email" class="form-control" placeholder="name@example.com" required>
                        </div>
                        
                        <div class="mb-3">
                            <div class="d-flex justify-content-between align-items-center">
                                <label class="form-label fw-semibold"><i class="bi bi-key text-success me-2"></i>Password</label>
                                <a href="#" class="text-success small text-decoration-none">Forgot?</a>
                            </div>
                            <input type="password" id="login-password" class="form-control" placeholder="••••••••" required>
                        </div>

                        <div class="form-check mb-4">
                            <input class="form-check-input" type="checkbox" id="remember-me">
                            <label class="form-check-label small text-muted" for="remember-me">Remember me on this device</label>
                        </div>

                        <button type="submit" class="btn btn-green w-100 py-3 fw-bold">Sign In</button>
                    </form>

                    <div class="text-center mt-4">
                        <p class="text-muted small mb-0">Don't have an account? <a href="register.html" class="text-success fw-bold text-decoration-none">Register here</a></p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="py-3 mt-auto">
        <p class="mb-0">&copy; 2026 chargEV. All Rights Reserved.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
